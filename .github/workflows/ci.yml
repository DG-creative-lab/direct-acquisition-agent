name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: make arch-check
        if: matrix.shard == 1
      - run: make test-shard
        env:
          SHARD: ${{ matrix.shard }}
          BACKEND_SHARDS: 4
          BACKEND_TIMINGS: backend-timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-timings-3.14-${{ matrix.shard }}
          path: backend-timings.json
          if-no-files-found: ignore
          retention-days: 14
  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 scripts/check_failure_mutations.py --shard "${{ matrix.shard }}" --shards 4
  interface:
    # A PR may opt out of Chromium only. Main, types/build and formatting remain checked.
    env:
      RUN_BROWSER_CHECKS: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-browser-checks') }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
        if: env.RUN_BROWSER_CHECKS == 'true'
      - run: pnpm --dir frontend run build
      - run: pnpm --dir frontend run format:check
        if: matrix.shard == 1
      - name: Run browser checks
        run: pnpm --dir frontend test
        if: env.RUN_BROWSER_CHECKS == 'true'
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_SHARDS: 2
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_BROWSER_CHECKS == 'true'
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            .local/browser-test-results
            .local/browser-reports
          include-hidden-files: true
          retention-days: 7
      - name: Record browser opt-out
        if: env.RUN_BROWSER_CHECKS != 'true'
        run: echo 'Chromium checks skipped by the skip-browser-checks PR label. Build, type checks, formatting and backend checks still run. Main always runs Chromium.' >> "$GITHUB_STEP_SUMMARY"
